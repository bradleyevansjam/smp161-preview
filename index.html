}, {"id": "1.2", "section": "1", "lo": [1, 2, 3, 4, 5, 6], "type": "flashcards", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx 'THE 20 GOLDEN RULES OF A MARSHAL', the client's order", "bloom": "remember", "safetyCritical": true, "a11y": {"alternative": "One card at a time: the card is a button that shows its text; previous / next buttons move between the cards.", "state": "Opened cards are marked with a tick and the count, never colour alone."}, "situation": {"sid": "smp161-S035", "en": "The 20 Golden Rules of a Marshal. Learn these by heart.", "ar": "القواعد الذهبية الـ20 للمنظِّم. احفظوها عن ظهر قلب."}, "task": {"sid": "smp161-S036", "en": "Tap each card to read the rule. Open all 20 to continue.", "ar": "اضغطوا على كل بطاقة لتقرؤوا القاعدة. افتحوا البطاقات الـ20 كلها للمتابعة."}, "x_mechanic": "flip", "x_minRead": 20, "x_layout": "grid", "x_cols": 4, "cards": [{"icon": "handshake", "title": {"sid": "smp161-S037", "en": "Golden rule 1", "ar": "القاعدة الذهبية 1"}, "text": {"sid": "smp161-S038", "en": "Safety first, service always.", "ar": "السلامة أولًا، والخدمة دائمًا."}}, {"icon": "magnifying glass", "title": {"sid": "smp161-S039", "en": "Golden rule 2", "ar": "القاعدة الذهبية 2"}, "text": {"sid": "smp161-S040", "en": "Marshals CANNOT search anyone. Marshals CANNOT eject anyone.", "ar": "لا يجوز لمنظم الحشود تفتيش أي شخص. ولا يجوز لمنظم الحشود إخراج أي شخص."}}, {"icon": "raised hand", "title": {"sid": "smp161-S041", "en": "Golden rule 3", "ar": "القاعدة الذهبية 3"}, "text": {"sid": "smp161-S042", "en": "Never touch, push, pull, hold or block anyone.", "ar": "لا تلمسوا أي شخص ولا تدفعوه ولا تسحبوه ولا تمسكوه ولا تعترضوا طريقه أبدًا."}}, {"icon": "backpack", "title": {"sid": "smp161-S043", "en": "Golden rule 4", "ar": "القاعدة الذهبية 4"}, "text": {"sid": "smp161-S044", "en": "Never take (confiscate) anyone's property.", "ar": "لا تأخذوا (تصادروا) ممتلكات أحد أبدًا."}}, {"icon": "speaking head", "title": {"sid": "smp161-S045", "en": "Golden rule 5", "ar": "القاعدة الذهبية 5"}, "text": {"sid": "smp161-S046", "en": "Your supervisor is always your first call.", "ar": "مشرفكم هو دائمًا أول من تتصلون به."}}, {"icon": "up arrow", "title": {"sid": "smp161-S047", "en": "Golden rule 6", "ar": "القاعدة الذهبية 6"}, "text": {"sid": "smp161-S048", "en": "No answer, or getting worse? Call again, then go to your Area Leader.", "ar": "لا يوجد رد، أو الوضع يزداد سوءًا؟ اتصلوا مرة أخرى، ثم اصعدوا إلى قائد منطقتكم."}}, {"icon": "warning", "title": {"sid": "smp161-S049", "en": "Golden rule 7", "ar": "القاعدة الذهبية 7"}, "text": {"sid": "smp161-S050", "en": "Danger to life right now? Move people away, call the nearest Security, police or medical team, then report.", "ar": "هل حياة أحدهم في خطر الآن؟ أبعدوا الناس عن الخطر، واستعينوا بأقرب فرد من الأمن أو الشرطة أو الفريق الطبي، ثم أبلغوا."}}, {"icon": "speaking head", "title": {"sid": "smp161-S051", "en": "Golden rule 8", "ar": "القاعدة الذهبية 8"}, "text": {"sid": "smp161-S052", "en": "Never go silent. Keep your supervisor updated.", "ar": "لا تتوقفوا عن الإبلاغ أبدًا. أبقوا مشرفكم على اطّلاع."}}, {"icon": "eyes", "title": {"sid": "smp161-S053", "en": "Golden rule 9", "ar": "القاعدة الذهبية 9"}, "text": {"sid": "smp161-S054", "en": "Face the crowd, not the match.", "ar": "واجهوا الحشود، لا المباراة."}}, {"icon": "exit sign", "title": {"sid": "smp161-S055", "en": "Golden rule 10", "ar": "القاعدة الذهبية 10"}, "text": {"sid": "smp161-S056", "en": "Keep exits, gangways and emergency routes clear at all times.", "ar": "أبقوا المخارج والممرات ومسارات الطوارئ خالية في جميع الأوقات."}}, {"icon": "raised hand", "title": {"sid": "smp161-S057", "en": "Golden rule 11", "ar": "القاعدة الذهبية 11"}, "text": {"sid": "smp161-S058", "en": "Stop & Hold, opening gates and changing routes happen ONLY on instruction.", "ar": "الإيقاف والانتظار وفتح البوابات وتغيير المسارات تتم عند التعليمات فقط."}}, {"icon": "megaphone", "title": {"sid": "smp161-S059", "en": "Golden rule 12", "ar": "القاعدة الذهبية 12"}, "text": {"sid": "smp161-S060", "en": "Spot it early, report it early. Small reports save lives.", "ar": "لاحظوه مبكرًا، وأبلغوا عنه مبكرًا. البلاغات الصغيرة تنقذ الأرواح."}}, {"icon": "radio", "title": {"sid": "smp161-S061", "en": "Golden rule 13", "ar": "القاعدة الذهبية 13"}, "text": {"sid": "smp161-S062", "en": "Radio: CALL SIGN, WHERE, WHAT, WHO, WHAT I'M DOING, OVER.", "ar": "اللاسلكي: رمز النداء، أين، ماذا، من، ماذا أفعل، حوّل."}}, {"icon": "memo", "title": {"sid": "smp161-S063", "en": "Golden rule 14", "ar": "القاعدة الذهبية 14"}, "text": {"sid": "smp161-S064", "en": "Facts, not opinions. Never guess. Never spread rumours.", "ar": "حقائق لا آراء. لا تخمّنوا أبدًا. لا تنشروا الشائعات أبدًا."}}, {"icon": "round pushpin", "title": {"sid": "smp161-S065", "en": "Golden rule 15", "ar": "القاعدة الذهبية 15"}, "text": {"sid": "smp161-S066", "en": "Stay on your post until you are relieved or stood down.", "ar": "ابقوا في نقطة تمركزكم حتى يحلّ أحد محلّكم أو تُنهى مناوبتكم."}}, {"icon": "megaphone", "title": {"sid": "smp161-S067", "en": "Golden rule 16", "ar": "القاعدة الذهبية 16"}, "text": {"sid": "smp161-S068", "en": "Aggressive person? Step back, keep your distance, report. Never get physical.", "ar": "شخص عدواني؟ تراجعوا، وحافظوا على مسافتكم، وأبلغوا. ولا تتدخّلوا جسديًا أبدًا."}}, {"icon": "raised hand", "title": {"sid": "smp161-S069", "en": "Golden rule 17", "ar": "القاعدة الذهبية 17"}, "text": {"sid": "smp161-S070", "en": "Suspicious item? Don't touch. Step back 15 metres. Say 'Item of Interest'. Never say 'bomb'.", "ar": "غرض مشبوه؟ لا تلمسوه. ابتعدوا 15 مترًا. قولوا «غرض محل اهتمام». لا تقولوا «قنبلة» أبدًا."}}, {"icon": "speaking head", "title": {"sid": "smp161-S071", "en": "Golden rule 18", "ar": "القاعدة الذهبية 18"}, "text": {"sid": "smp161-S072", "en": "In an emergency, the agency in charge leads. Follow them, then tell your supervisor.", "ar": "في حالات الطوارئ، تتولى الجهة المسؤولة القيادة. اتبعوا تعليماتها، ثم أخبروا مشرفكم."}}, {"icon": "wheelchair", "title": {"sid": "smp161-S073", "en": "Golden rule 19", "ar": "القاعدة الذهبية 19"}, "text": {"sid": "smp161-S074", "en": "Ask first before you help anyone with a disability.", "ar": "استأذنوا أولًا قبل أن تساعدوا أي شخص من ذوي الإعاقة."}}, {"icon": "round pushpin", "title": {"sid": "smp161-S075", "en": "Golden rule 20", "ar": "القاعدة الذهبية 20"}, "text": {"sid": "smp161-S076", "en": "No photos of fans. No posting. Keep personal details private.", "ar": "ممنوع تصوير المشجعين. ممنوع النشر. حافظوا على سرية البيانات الشخصية."}}], "xp": {"complete": 5}}, {"id": "1.3", "section": "1", "lo": [1], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 1 GOLDEN RULES 1-3; x_info = Part 1 RULES OF THUMB and POINTS TO REMEMBER, word for word, optional (decision 438)", "heading": {"sid": "smp161-S077", "en": "The tournament and your mission", "ar": "البطولة ومهمتكم"}, "kicker": {"sid": "smp161-S078", "en": "Lessons 1.1 and 1.2 · Golden rules", "ar": "الدرسان 1.1 و1.2 · القواعد الذهبية"}, "lines": [{"sid": "smp161-S079", "en": "Our mission: SAFETY FIRST, SERVICE ALWAYS.", "ar": "مهمتنا: السلامة أولًا، والخدمة دائمًا."}, {"sid": "smp161-S080", "en": "Service means: Host, Direct, Inform, Assist, Support.", "ar": "الخدمة تعني: الاستقبال، والتوجيه، والإعلام، والمساعدة، والدعم."}, {"sid": "smp161-S081", "en": "What you do at your post is part of how the tournament is remembered.", "ar": "ما تفعلونه في مواقعكم جزء من الطريقة التي ستُذكر بها البطولة."}], "x_lineIcons": [{"icon": "shield"}, {"icon": "handshake"}, {"icon": "round pushpin"}], "xp": {"complete": 5}, "media": ["smp161-p1"], "x_info": {"label": {"sid": "smp161-S082", "en": "More to remember", "ar": "المزيد للتذكّر"}, "title": {"sid": "smp161-S083", "en": "The tournament and your mission: more to remember", "ar": "البطولة ومهمتكم: المزيد للتذكّر"}, "groups": [{"title": {"sid": "smp161-S084", "en": "Rules of thumb", "ar": "قواعد عملية"}, "icon": "thumbs up", "lines": [{"sid": "smp161-S085", "en": "Football fans arrive late. The biggest rush is in the last 30 minutes before kick-off. Be on post early.", "ar": "يصل مشجعو كرة القدم متأخرين. تكون ذروة التدفق في آخر 30 دقيقة قبل انطلاق المباراة. كونوا في مواقعكم مبكرًا."}, {"sid": "smp161-S086", "en": "Moods change in seconds after goals, red cards and late drama. Watch the crowd.", "ar": "المزاج يتغيّر في ثوانٍ بعد الأهداف والبطاقات الحمراء والإثارة المتأخرة. راقبوا الحشود."}, {"sid": "smp161-S087", "en": "At the final whistle almost everyone leaves at the same time. Exits fill fast.", "ar": "عند صافرة النهاية يغادر الجميع تقريبًا في الوقت نفسه. المخارج تمتلئ بسرعة."}, {"sid": "smp161-S088", "en": "At a concert, pressure builds at the front of the stage. At football, watch gates, concourses, stairs and exits.", "ar": "في الحفل الموسيقي، يتزايد الضغط أمام المسرح. وفي كرة القدم، راقبوا البوابات والردهات والسلالم والمخارج."}, {"sid": "smp161-S089", "en": "Fan zone and festival crowds arrive spread through the day. The busy moment is closing time.", "ar": "حشود منطقة المشجعين والمهرجانات تصل موزّعة على مدار اليوم. ووقت الذروة هو وقت الإغلاق."}]}, {"title": {"sid": "smp161-S090", "en": "Points to remember", "ar": "نقاط للتذكّر"}, "icon": "round pushpin", "lines": [{"sid": "smp161-S091", "en": "Dates: 7 January to 5 February 2027. 24 nations. Three host cities: Riyadh, Jeddah and Al Khobar.", "ar": "التواريخ: من 7 يناير إلى 5 فبراير 2027. 24 منتخبًا. ثلاث مدن مستضيفة: الرياض وجدة والخبر."}, {"sid": "smp161-S092", "en": "Riyadh has the most stadiums (five of the eight).", "ar": "في الرياض أكبر عدد من الملاعب (خمسة من الثمانية)."}, {"sid": "smp161-S093", "en": "One serious incident can become the story of the whole tournament. Safe matches show the Kingdom as a great host.", "ar": "حادث خطير واحد قد يصبح قصة البطولة كلها. المباريات الآمنة تُظهر المملكة مستضيفًا رائعًا."}, {"sid": "smp161-S094", "en": "Crowd disasters (such as Hillsborough and Kanjuruhan) show why marshals must watch and report early.", "ar": "كوارث الحشود (مثل هيلزبره وكانجوروهان) تبيّن لماذا يجب أن يراقب المنظِّمون ويبلّغوا مبكرًا."}, {"sid": "smp161-S095", "en": "To pass: online pass mark 21 out of 30, and every safety-critical question and practical element must be correct.", "ar": "للنجاح: درجة النجاح في الاختبار الإلكتروني 21 من 30، ويجب أن تكون كل الأسئلة الحاسمة للسلامة وكل العناصر التطبيقية صحيحة."}]}]}}, {"id": "1.4", "section": "1", "lo": [1], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 1 RULES OF THUMB (required: behind safety-critical test question Q3, decision 438)", "heading": {"sid": "smp161-S096", "en": "The tournament and your mission", "ar": "البطولة ومهمتكم"}, "kicker": {"sid": "smp161-S097", "en": "A rule of thumb you must know", "ar": "قاعدة عملية يجب أن تعرفوها"}, "lines": [{"sid": "smp161-S098", "en": "At the final whistle almost everyone leaves at the same time. Exits fill fast.", "ar": "عند صافرة النهاية يغادر الجميع تقريبًا في الوقت نفسه. المخارج تمتلئ بسرعة."}], "x_lineIcons": [{"icon": "exit sign"}], "safetyCritical": true, "xp": {"complete": 5}}, {"id": "1.5", "section": "1", "lo": [1], "type": "mcq", "x_part": 1, "bloom": "apply", "safetyCritical": true, "a11y": {"alternative": "Every choice is a labelled button; screen readers read the text.", "state": "Right and wrong are shown with ✓ / ✕ and words, never colour alone."}, "x_unscored": true, "src": "SMP 1.2 approved lesson-check bank, item Q04, word for word (smp12-tournament-event-types); not one of the 60 (similarity to the nearest test question 0.14)", "kicker": {"sid": "smp161-S099", "en": "Quick check · Lesson 1.2", "ar": "تحقّق سريع · الدرس 1.2"}, "task": {"sid": "smp161-S100", "en": "You are on post at a gate 90 minutes before kick-off. The plaza is still quiet. When will most fans arrive?", "ar": "أنتم في موقعكم عند بوابة قبل 90 دقيقة من انطلاق المباراة. الساحة ما زالت هادئة. متى سيصل معظم المشجعين؟"}, "options": [{"text": {"sid": "smp161-S101", "en": "As soon as the gates open, then a steady flow", "ar": "فور فتح البوابات، ثم بتدفق ثابت"}, "score": 0, "feedback": {"sid": "smp161-S102", "en": "That is a concert pattern. The late rush - be on post early and ready.", "ar": "هذا نمط الحفلات الموسيقية. التدفق المتأخر - كونوا في مواقعكم مبكرًا ومستعدين."}}, {"text": {"sid": "smp161-S103", "en": "At half-time", "ar": "في استراحة ما بين الشوطين"}, "score": 0, "feedback": {"sid": "smp161-S104", "en": "At half-time fans move to the concourses; they are already inside. The late rush - be on post early and ready.", "ar": "في استراحة ما بين الشوطين يتجه المشجعون إلى الممرات؛ فهم في الداخل بالفعل. التدفق المتأخر - كونوا في مواقعكم مبكرًا ومستعدين."}}, {"text": {"sid": "smp161-S105", "en": "Evenly through the afternoon, from gates open to kick-off", "ar": "بالتساوي على مدار فترة ما بعد الظهر، من فتح البوابات حتى انطلاق المباراة"}, "score": 0, "feedback": {"sid": "smp161-S106", "en": "Spread-out arrival is a festival or fan-zone pattern. The late rush - be on post early and ready.", "ar": "الوصول الموزّع نمط المهرجانات ومناطق المشجعين. التدفق المتأخر - كونوا في مواقعكم مبكرًا ومستعدين."}}, {"text": {"sid": "smp161-S107", "en": "In the last hour; the biggest rush in the last 30 minutes", "ar": "في الساعة الأخيرة، وذروة التدفق في آخر 30 دقيقة"}, "score": 2, "feedback": {"sid": "smp161-S108", "en": "The late rush - be on post early and ready.", "ar": "التدفق المتأخر - كونوا في مواقعكم مبكرًا ومستعدين."}}], "x_review": {"lesson": "1.2", "title": {"sid": "smp161-S109", "en": "AFC Asian Cup 2027, event types & why crowd safety matters", "ar": "كأس آسيا 2027 وأنواع الفعاليات وأهمية سلامة الحشود"}, "aid": {"sid": "smp161-S110", "en": "FOOTBALL CROWDS - WHAT TO EXPECT", "ar": "جماهير كرة القدم - ماذا تتوقعون"}}, "xp": {"complete": 5}}, {"id": "1.6", "section": "1", "lo": [1], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 3 GOLDEN RULES 1-3", "heading": {"sid": "smp161-S111", "en": "Your role, your red lines and your chain of command", "ar": "دوركم وخطوطكم الحمراء وتسلسلكم القيادي"}, "kicker": {"sid": "smp161-S112", "en": "Lesson 2.1 · Golden rules", "ar": "الدرس 2.1 · القواعد الذهبية"}, "lines": [{"sid": "smp161-S113", "en": "Marshals CANNOT search anyone. Marshals CANNOT eject anyone.", "ar": "لا يجوز لمنظم الحشود تفتيش أي شخص. ولا يجوز لمنظم الحشود إخراج أي شخص."}, {"sid": "smp161-S114", "en": "Never touch, push, pull, hold or restrain anyone.", "ar": "لا تلمسوا أي شخص ولا تدفعوه ولا تسحبوه ولا تمسكوه ولا تقيّدوه أبدًا."}, {"sid": "smp161-S115", "en": "Never take anyone's property. Never hold anyone 'until the police come'. Standing in a doorway to stop someone leaving counts as holding them.", "ar": "لا تأخذوا ممتلكات أحد أبدًا. لا تمسكوا أي شخص «حتى تأتي الشرطة» أبدًا. الوقوف في المدخل لمنع شخص من المغادرة يُعدّ إمساكًا به."}], "x_lineIcons": [{"icon": "magnifying glass"}, {"icon": "raised hand"}, {"icon": "raised hand"}], "xp": {"complete": 5}, "media": ["smp161-p3"]}, {"id": "1.7", "section": "1", "lo": [1], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 3 GOLDEN RULES 4-5; x_info = Part 3 RULES OF THUMB and POINTS TO REMEMBER, word for word, optional (decision 438)", "heading": {"sid": "smp161-S116", "en": "Your role, your red lines and your chain of command", "ar": "دوركم وخطوطكم الحمراء وتسلسلكم القيادي"}, "kicker": {"sid": "smp161-S117", "en": "Lesson 2.1 · Golden rules", "ar": "الدرس 2.1 · القواعد الذهبية"}, "lines": [{"sid": "smp161-S118", "en": "Aggressive person? Step back, keep your distance, report. Never get physical.", "ar": "شخص عدواني؟ تراجعوا، وحافظوا على مسافتكم، وأبلغوا. ولا تتدخّلوا جسديًا أبدًا."}, {"sid": "smp161-S119", "en": "Your supervisor is always your first call.", "ar": "مشرفكم هو دائمًا أول من تتصلون به."}], "x_lineIcons": [{"icon": "megaphone"}, {"icon": "speaking head"}], "xp": {"complete": 5}, "x_info": {"label": {"sid": "smp161-S120", "en": "More to remember", "ar": "المزيد للتذكّر"}, "title": {"sid": "smp161-S121", "en": "Your role, your red lines and your chain of command: more to remember", "ar": "دوركم وخطوطكم الحمراء وتسلسلكم القيادي: المزيد للتذكّر"}, "groups": [{"title": {"sid": "smp161-S122", "en": "Rules of thumb", "ar": "قواعد عملية"}, "icon": "thumbs up", "lines": [{"sid": "smp161-S123", "en": "Escalation ladder: 1) Supervisor first. 2) No answer or getting worse? Call again, then go to the Area Leader. 3) Danger to life now? Move people away, call the nearest Security / police / medical team, then report. 4) Never go silent.", "ar": "سلّم التصعيد: 1) أبلغوا المشرف أولًا. 2) لا يوجد رد أو الوضع يزداد سوءًا؟ اتصلوا مرة أخرى، ثم اصعدوا إلى قائد المنطقة. 3) خطر على الحياة الآن؟ أبعدوا الناس، واتصلوا بأقرب فريق أمن / شرطة / فريق طبي، ثم أبلغوا. 4) لا تتوقفوا عن الإبلاغ أبدًا."}, {"sid": "smp161-S124", "en": "Act on instructions from your chain of command, or from Civil Defence, Police or Security in an emergency.", "ar": "نفّذوا التعليمات التي تأتيكم عبر تسلسلكم القيادي، أو من الدفاع المدني أو الشرطة أو الأمن في حالات الطوارئ."}, {"sid": "smp161-S125", "en": "Someone asks you to open an emergency gate or hold a person? Politely say no and call your supervisor.", "ar": "يطلب منكم أحدهم فتح بوابة طوارئ أو إمساك شخص؟ ارفضوا بلباقة واتصلوا بمشرفكم."}, {"sid": "smp161-S126", "en": "A Civil Defence or police officer gives you a safety instruction? Do it straight away, then tell your supervisor.", "ar": "يعطيكم ضابط من الدفاع المدني أو الشرطة تعليمات سلامة؟ نفّذوها فورًا، ثم أخبروا مشرفكم."}, {"sid": "smp161-S127", "en": "Team habits: BRIEF - CONFIRM - STAY - SUPPORT - SPEAK UP.", "ar": "عادات الفريق: الإحاطة - التأكيد - البقاء - الدعم - التحدّث."}]}, {"title": {"sid": "smp161-S128", "en": "Points to remember", "ar": "نقاط للتذكّر"}, "icon": "round pushpin", "lines": [{"sid": "smp161-S129", "en": "Chain of command: Marshal → Supervisor → Area Leader → FNP Venue Manager → VOC.", "ar": "التسلسل القيادي: المنظِّم ← المشرف ← قائد المنطقة ← مدير الموقع لدى FNP ← مركز عمليات الملعب (VOC)."}, {"sid": "smp161-S130", "en": "Venue Security: screening and bag checks (with consent). They may refuse entry.", "ar": "أمن الملعب: الفحص الأمني وفحص الحقائب (بالموافقة). ويمكنهم رفض الدخول."}, {"sid": "smp161-S131", "en": "Police: crime, fights, suspicious items, removal, detention and arrest.", "ar": "الشرطة: الجرائم، والمشاجرات، والأغراض المشبوهة، والإخراج، والاحتجاز، والتوقيف."}, {"sid": "smp161-S132", "en": "Saudi Civil Defence: fire and any evacuation. They take command.", "ar": "الدفاع المدني السعودي: الحرائق وأي إخلاء. وهم يتولون القيادة."}, {"sid": "smp161-S133", "en": "Saudi Red Crescent / venue medical: illness and injury.", "ar": "الهلال الأحمر السعودي / الفريق الطبي في الملعب: المرض والإصابات."}, {"sid": "smp161-S134", "en": "VOC (Venue Operations Centre): all agencies together. The big decisions are made here.", "ar": "مركز عمليات الملعب (VOC): جميع الجهات معًا. القرارات الكبرى تُتخذ هنا."}, {"sid": "smp161-S135", "en": "Head of Marshals: attendance, food, water, uniforms and equipment.", "ar": "رئيس المنظمين: الحضور، والطعام، والماء، والزي، والمعدات."}]}]}}, {"id": "1.8", "section": "1", "lo": [1], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 3 RULES OF THUMB (required: behind safety-critical test question Q12, decision 438)", "heading": {"sid": "smp161-S136", "en": "Your role, your red lines and your chain of command", "ar": "دوركم وخطوطكم الحمراء وتسلسلكم القيادي"}, "kicker": {"sid": "smp161-S137", "en": "A rule of thumb you must know", "ar": "قاعدة عملية يجب أن تعرفوها"}, "lines": [{"sid": "smp161-S138", "en": "Someone asks you to open an emergency gate or hold a person? Politely say no and call your supervisor.", "ar": "يطلب منكم أحدهم فتح بوابة طوارئ أو إمساك شخص؟ ارفضوا بلباقة واتصلوا بمشرفكم."}], "x_lineIcons": [{"icon": "raised hand"}], "safetyCritical": true, "xp": {"complete": 5}}, {"id": "1.9", "section": "1", "lo": [1], "type": "mcq", "x_part": 3, "bloom": "apply", "safetyCritical": true, "a11y": {"alternative": "Every choice is a labelled button; screen read cted by law. Not reporting a known breach is also a breach.", "ar": "خصوصية المشجع يحميها النظام. وعدم الإبلاغ عن مخالفة معروفة هو أيضًا مخالفة."}}, {"text": {"sid": "smp161-S193", "en": "Don't share it, ask for it to be deleted, and tell your supervisor", "ar": "لا تشاركوه، واطلبوا حذفه، وأبلغوا المشرف"}, "score": 2, "feedback": {"sid": "smp161-S194", "en": "A fan's privacy is protected by law. Not reporting a known breach is also a breach.", "ar": "خصوصية المشجع يحميها النظام. وعدم الإبلاغ عن مخالفة معروفة هو أيضًا مخالفة."}}, {"text": {"sid": "smp161-S195", "en": "Forward it to a friend", "ar": "أرسلوه إلى صديق"}, "score": 0, "feedback": {"sid": "smp161-S196", "en": "A fan's privacy is protected by law. Not reporting a known breach is also a breach.", "ar": "خصوصية المشجع يحميها النظام. وعدم الإبلاغ عن مخالفة معروفة هو أيضًا مخالفة."}}, {"text": {"sid": "smp161-S197", "en": "Save it in case you need it later", "ar": "احفظوه في حال احتجتم إليه لاحقًا"}, "score": 0, "feedback": {"sid": "smp161-S198", "en": "A fan's privacy is protected by law. Not reporting a known breach is also a breach.", "ar": "خصوصية المشجع يحميها النظام. وعدم الإبلاغ عن مخالفة معروفة هو أيضًا مخالفة."}}], "x_review": {"lesson": "2.3", "title": {"sid": "smp161-S199", "en": "Code of Conduct in practice", "ar": "تطبيق قواعد السلوك"}, "aid": {"sid": "smp161-S200", "en": "On duty - Do", "ar": "أثناء العمل - افعلوا"}}, "xp": {"complete": 5}}, {"id": "1.14", "section": "1", "lo": [1], "type": "sectionClose", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Golden rule (stage takeaway); job aid from the guide", "xp": {"complete": 10}, "takeaway": {"sid": "smp161-S201", "en": "Marshals CANNOT search anyone. Marshals CANNOT eject anyone.", "ar": "لا يجوز لمنظم الحشود تفتيش أي شخص. ولا يجوز لمنظم الحشود إخراج أي شخص."}, "x_jobAid": {"title": {"sid": "smp161-S202", "en": "The 20 Golden Rules (1 to 7)", "ar": "القواعد الذهبية الـ20 (من 1 إلى 7)"}, "steps": [{"sid": "smp161-S203", "en": "Safety first, service always.", "ar": "السلامة أولًا، والخدمة دائمًا."}, {"sid": "smp161-S204", "en": "Marshals CANNOT search anyone. Marshals CANNOT eject anyone.", "ar": "لا يجوز لمنظم الحشود تفتيش أي شخص. ولا يجوز لمنظم الحشود إخراج أي شخص."}, {"sid": "smp161-S205", "en": "Never touch, push, pull, hold or block anyone.", "ar": "لا تلمسوا أي شخص ولا تدفعوه ولا تسحبوه ولا تمسكوه ولا تعترضوا طريقه أبدًا."}, {"sid": "smp161-S206", "en": "Never take (confiscate) anyone's property.", "ar": "لا تأخذوا (تصادروا) ممتلكات أحد أبدًا."}, {"sid": "smp161-S207", "en": "Your supervisor is always your first call.", "ar": "مشرفكم هو دائمًا أول من تتصلون به."}, {"sid": "smp161-S208", "en": "No answer, or getting worse? Call again, then go to your Area Leader.", "ar": "لا يوجد رد، أو الوضع يزداد سوءًا؟ اتصلوا مرة أخرى، ثم اصعدوا إلى قائد منطقتكم."}, {"sid": "smp161-S209", "en": "Danger to life right now? Move people away, call the nearest Security, police or medical team, then report.", "ar": "هل حياة أحدهم في خطر الآن؟ أبعدوا الناس عن الخطر، واستعينوا بأقرب فرد من الأمن أو الشرطة أو الفريق الطبي، ثم أبلغوا."}]}}, {"id": "2.1", "section": "2", "lo": [2], "type": "teach", "src": "DECISION 438 day story (ours, R2): stage 2 opening; facts from the guide parts of this stage", "heading": {"sid": "smp161-S210", "en": "You arrive", "ar": "تصلون"}, "media": ["smp161-s2"], "lines": [{"sid": "smp161-S211", "en": "You sign in, collect your kit and do your radio check.", "ar": "تسجّلون حضوركم، وتستلمون معداتكم، وتُجرون فحص الاتصال."}, {"sid": "smp161-S212", "en": "Then the briefing. Then you go on post.", "ar": "ثم الإحاطة. ثم تتوجهون إلى نقطة التمركز."}, {"sid": "smp161-S213", "en": "Know your area before the first fan arrives.", "ar": "اعرفوا منطقتكم قبل وصول أول مشجع."}], "x_lineIcons": [{"icon": "radio"}, {"icon": "round pushpin"}, {"icon": "busts in silhouette"}], "xp": {"complete": 5}}, {"id": "2.2", "section": "2", "lo": [2], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 5 GOLDEN RULES 1-3; x_info = Part 5 RULES OF THUMB and POINTS TO REMEMBER, word for word, optional (decision 438)", "heading": {"sid": "smp161-S214", "en": "Know your venue, customer service and wayfinding", "ar": "تعرّفوا على الملعب، وخدمة العملاء والإرشاد إلى الوجهات"}, "kicker": {"sid": "smp161-S215", "en": "Lessons 3.1 and 3.2 · Golden rules", "ar": "الدرسان 3.1 و3.2 · القواعد الذهبية"}, "lines": [{"sid": "smp161-S216", "en": "Know your nearest exit, first aid point and assembly point BEFORE the gates open.", "ar": "اعرفوا أقرب مخرج إليكم، ونقطة الإسعافات الأولية، ونقطة التجمع قبل فتح البوابات."}, {"sid": "smp161-S217", "en": "Don't know the answer? Never guess. Say 'One moment', check, ask your supervisor or the Info Point.", "ar": "لا تعرفون الإجابة؟ لا تخمّنوا أبدًا. قولوا «لحظة من فضلك»، ثم تحقّقوا، واسألوا مشرفكم أو نقطة المعلومات."}, {"sid": "smp161-S218", "en": "Never send fans through emergency exits, closed gates or staff doors as a shortcut.", "ar": "لا ترسلوا المشجعين أبدًا عبر مخارج الطوارئ أو البوابات المغلقة أو أبواب الموظفين كطريق مختصر."}], "x_lineIcons": [{"icon": "exit sign"}, {"icon": "speaking head"}, {"icon": "exit sign"}], "xp": {"complete": 5}, "media": ["smp161-p5"], "x_info": {"label": {"sid": "smp161-S219", "en": "More to remember", "ar": "المزيد للتذكّر"}, "title": {"sid": "smp161-S220", "en": "Know your venue, customer service and wayfinding: more to remember", "ar": "تعرّفوا على الملعب، وخدمة العملاء والإرشاد إلى الوجهات: المزيد للتذكّر"}, "groups": [{"title": {"sid": "smp161-S221", "en": "Rules of thumb", "ar": "قواعد عملية"}, "icon": "thumbs up", "lines": [{"sid": "smp161-S222", "en": "Fan journey: travel → Last Mile → security check point (PSA) → gate → concourse → seat → departure.", "ar": "رحلة المشجع: التنقل ← الميل الأخير ← نقطة التفتيش الأمني (PSA) ← البوابة ← الردهة ← المقعد ← المغادرة."}, {"sid": "smp161-S223", "en": "Read the ticket in this order: GATE first, then block, row, seat.", "ar": "اقرؤوا التذكرة بهذا الترتيب: البوابة أولًا، ثم المبنى، فالصف، فرقم المقعد."}, {"sid": "smp161-S224", "en": "Good directions: stand beside the fan, point with an open hand (not one finger), use a landmark and a time ('past the kiosk, 3 minutes'), give no more than 3 steps.", "ar": "إرشاد جيد: قفوا بجانب المشجع، وأشيروا بيد مفتوحة (لا بإصبع واحد)، واستخدموا معلمًا ووقتًا («بعد الكشك، 3 دقائق»)، ولا تعطوا أكثر من 3 خطوات."}, {"sid": "smp161-S225", "en": "Check they understood: 'So, straight, then left?'", "ar": "تأكدوا أنهم فهموا: «إذن، إلى الأمام، ثم يسارًا؟»"}, {"sid": "smp161-S226", "en": "Offer the step-free route when needed.", "ar": "اعرضوا المسار الخالي من الدرج عند الحاجة."}]}, {"title": {"sid": "smp161-S227", "en": "Points to remember", "ar": "نقاط للتذكّر"}, "icon": "round pushpin", "lines": [{"sid": "smp161-S228", "en": "A Dot Plan shows every marshal position, including yours.", "ar": "تبيّن خطة التوزيع (دوت بلان) موقع كل منظِّم، بما في ذلك موقعكم."}, {"sid": "smp161-S229", "en": "Check the egress Dot Plan too. Your position may change for departure.", "ar": "تحقّقوا أيضًا من خطة التوزيع (دوت بلان) الخاصة بالخروج. قد يتغيّر موقعكم عند المغادرة."}, {"sid": "smp161-S230", "en": "Green sign = exit, first aid, assembly point. Red sign = fire equipment.", "ar": "اللافتة الخضراء تعني: مخرج، إسعافات أولية، أو نقطة تجمع. اللافتة الحمراء تعني: معدات إطفاء الحريق."}, {"sid": "smp161-S231", "en": "Fans never go into back-of-house, the mixed zone or the field of play.", "ar": "لا يدخل المشجعون أبداً المناطق الخلفية أو المنطقة المختلطة أو أرض الملعب."}, {"sid": "smp161-S232", "en": "Vomitory = the tunnel/opening from the concourse into the seating bowl.", "ar": "ممر المدرج = النفق/الفتحة من الردهة إلى المدرجات."}]}]}}, {"id": "2.3", "section": "2", "lo": [2], "type": "mcq", "x_part": 5, "bloom": "apply", "safetyCritical": true, "a11y": {"alternative": "Every choice is a labelled button; screen readers read the text.", "state": "Right and wrong are shown with ✓ / ✕ and words, never colour alone."}, "x_unscor ي. التغيّر هو علامة الإنذار."}], "x_lineIcons": [{"icon": "star"}], "xp": {"complete": 5}, "x_info": {"label": {"sid": "smp161-S534", "en": "More to remember", "ar": "المزيد للتذكّر"}, "title": {"sid": "smp161-S535", "en": "Communicating with crowds and crowd psychology: more to remember", "ar": "التواصل مع الحشود وسيكولوجية الجماهير: المزيد للتذكّر"}, "groups": [{"title": {"sid": "smp161-S536", "en": "Rules of thumb", "ar": "قواعد عملية"}, "icon": "thumbs up", "lines": [{"sid": "smp161-S537", "en": "STOP: one arm forward, open palm - 'Stop here, please'.", "ar": "قف: ذراع واحدة إلى الأمام، والكف مفتوحة - «توقّفوا هنا من فضلكم»."}, {"sid": "smp161-S538", "en": "GO-MOVE: hand sweeps towards the route - 'This way, please'.", "ar": "تحرّكوا: اليد تتحرك باتجاه المسار - «من هنا من فضلكم»."}, {"sid": "smp161-S539", "en": "HOLD: both palms forward, steady - 'Please wait here'.", "ar": "انتظروا: الكفّان إلى الأمام وثابتتان - «انتظروا هنا من فضلكم»."}, {"sid": "smp161-S540", "en": "Five-part announcement: Attention → Who/where → What to do → Why → Thank and repeat. About 30 seconds, Arabic then English.", "ar": "إعلان من خمسة أجزاء: الانتباه → من / أين → ما المطلوب → السبب → الشكر والتكرار. نحو 30 ثانية، بالعربية ثم بالإنجليزية."}, {"sid": "smp161-S541", "en": "Everyone uses the same signals. Mixed signals confuse fans and create risk.", "ar": "الجميع يستخدم الإشارات نفسها. الإشارات المختلطة تربك المشجعين وتسبب الخطر."}, {"sid": "smp161-S542", "en": "Mood scale: Calm → Lively (normal) → Tense → Hostile / Distressed.", "ar": "مقياس المزاج: هادئة → حماسية (طبيعي) → متوترة → عدائية / مضطربة."}]}, {"title": {"sid": "smp161-S543", "en": "Points to remember", "ar": "نقاط للتذكّر"}, "icon": "round pushpin", "lines": [{"sid": "smp161-S544", "en": "What changes a crowd: goals, rivalry, late goals and the final whistle, heat, waiting with no information, rumours.", "ar": "ما يغيّر الحشد: الأهداف، التنافس، الأهداف المتأخرة وصافرة النهاية، الحرارة، الانتظار بلا معلومات، الشائعات."}, {"sid": "smp161-S545", "en": "Warning signs: sudden noise or silence, heads turning to one spot, groups forming, raised voices, pushing, people trying to get out.", "ar": "علامات الإنذار: ضجيج أو صمت مفاجئ، رؤوس تلتفت إلى نقطة واحدة، مجموعات تتشكل، أصوات مرتفعة، تدافع، أشخاص يحاولون الخروج."}, {"sid": "smp161-S546", "en": "Your response: stay calm, stay neutral, keep routes clear, give facts, never rumours, report early.", "ar": "تصرّفكم: حافظوا على هدوئكم وحيادكم، وأبقوا الطرق خالية، وقدّموا الحقائق، لا الشائعات أبدًا، وأبلغوا مبكرًا."}, {"sid": "smp161-S547", "en": "Keep scanning your whole area. You only see what you look at.", "ar": "استمروا في مسح منطقتكم كلها بأعينكم. لا ترون إلا ما تنظرون إليه."}, {"sid": "smp161-S548", "en": "A held queue is released only on instruction, a few at a time.", "ar": "لا يُطلق الطابور الموقوف إلا بناءً على التعليمات، وبأعداد قليلة في كل مرة."}]}]}}, {"id": "4.4", "section": "4", "lo": [4], "type": "mcq", "x_part": 6, "bloom": "apply", "safetyCritical": true, "a11y": {"alternative": "Every choice is a labelled button; screen readers read the text.", "state": "Right and wrong are shown with ✓ / ✕ and words, never colour alone."}, "x_unscored": true, "src": "SMP 4.1 approved lesson-check bank, item Q06, word for word (smp41-communicating-with-crowds); not one of the 60 (similarity to the nearest test question 0.13)", "kicker": {"sid": "smp161-S549", "en": "Quick check · Lesson 4.1", "ar": "تحقّق سريع · الدرس 4.1"}, "task": {"sid": "smp161-S550", "en": "Fans ignore your STOP signal and keep walking into a full area. What do you do?", "ar": "مشجعون يتجاهلون إشارة توقف (توقف ) ويواصلون المشي إلى منطقة ممتلئة. ماذا تفعلون؟"}, "options": [{"text": {"sid": "smp161-S551", "en": "Grab the first person", "ar": "الإمساك بأول شخص"}, "score": 0, "feedback": {"sid": "smp161-S552", "en": "No physical contact. Signal, speak, report.", "ar": "لا تلامس جسدي. أشيروا، وتحدثوا، وأبلغوا."}}, {"text": {"sid": "smp161-S553", "en": "Give up and walk away", "a "Never push people back. Never step into a dense crowd.", "ar": "لا تدفعوا الناس إلى الخلف أبدًا. لا تدخلوا حشدًا كثيفًا أبدًا."}, {"sid": "smp161-S577", "en": "Stop & Hold only on instruction.", "ar": "الإيقاف والانتظار عند التعليمات فقط."}], "x_lineIcons": [{"icon": "megaphone"}, {"icon": "raised hand"}, {"icon": "raised hand"}], "xp": {"complete": 5}, "media": ["smp161-p8"], "x_info": {"label": {"sid": "smp161-S578", "en": "More to remember", "ar": "المزيد للتذكّر"}, "title": {"sid": "smp161-S579", "en": "Crowd density, danger signs and surge moments: more to remember", "ar": "كثافة الحشود وعلامات الخطر ولحظات الاندفاع: المزيد للتذكّر"}, "groups": [{"title": {"sid": "smp161-S580", "en": "Rules of thumb", "ar": "قواعد عملية"}, "icon": "thumbs up", "lines": [{"sid": "smp161-S581", "en": "FINE - about 2 people in a 1 m square. People walk freely.", "ar": "جيد - نحو 2 في مربع مساحته 1 م. يمشي الناس بحرية."}, {"sid": "smp161-S582", "en": "BUSY - about 3. Slower, small gaps.", "ar": "مزدحم - نحو 3. أبطأ، فجوات صغيرة."}, {"sid": "smp161-S583", "en": "GETTING FULL - about 4. People touching → REPORT NOW.", "ar": "يمتلئ - نحو 4. الناس يتلامسون → بلّغوا الآن."}, {"sid": "smp161-S584", "en": "AT CAPACITY - nearly 5. Shoulder to shoulder, arms pinned → REPORT URGENTLY.", "ar": "عند السعة - قرابة 5. كتفاً إلى كتف، الأذرع محشورة → بلّغوا بصورة عاجلة."}, {"sid": "smp161-S585", "en": "Swaying or waves in a crowd = dangerous density. Report urgently.", "ar": "تمايل أو موجات في الحشد = كثافة خطرة. بلّغوا بشكل عاجل."}]}, {"title": {"sid": "smp161-S586", "en": "Points to remember", "ar": "نقاط للتذكّر"}, "icon": "round pushpin", "lines": [{"sid": "smp161-S587", "en": "Danger signs: pushing, swaying, shouting or screaming, distressed faces, children lifted up, arms pinned, people climbing out, flow stopping, someone falling, overheating or fainting.", "ar": "علامات الخطر: تدافع، تمايل، صراخ أو صياح، وجوه مضطربة، أطفال مرفوعون إلى الأعلى، أذرع محشورة، أشخاص يتسلقون للخروج، توقف التدفق، سقوط شخص، ارتفاع حرارة الجسم أو إغماء."}, {"sid": "smp161-S588", "en": "Surge moments: late arrivals, kick-off, goals, half-time, final whistle.", "ar": "لحظات الاندفاع: الوصول المتأخر، انطلاق المباراة، الأهداف، استراحة ما بين الشوطين، صافرة النهاية."}, {"sid": "smp161-S589", "en": "Hot-spots: gates, stairways, vomitories, kiosks, toilets, prayer areas, exits, corners, the Last Mile.", "ar": "النقاط الساخنة: البوابات، السلالم، ممرات المدرج، الأكشاك، دورات المياه، أماكن الصلاة، المخارج، الزوايا، الميل الأخير."}, {"sid": "smp161-S590", "en": "Our stadiums are all-seated. Density builds where people move and wait, not in the seats.", "ar": "ملاعبنا كلها بمقاعد. تتكوّن الكثافة حيث يتحرك الناس وينتظرون، لا بين المقاعد."}, {"sid": "smp161-S591", "en": "Dizzy, sweating fan in a packed area? Help them to space, report 'Medical Assistance', point to water.", "ar": "مشجع يشعر بدوار ويتعرّق في منطقة مكتظة؟ ساعدوه للوصول إلى مكان واسع، بلّغوا «طلب مساعدة طبية»، دلّوه على نقطة المياه."}]}]}}, {"id": "4.7", "section": "4", "lo": [4], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 8 RULES OF THUMB (required: behind safety-critical test question Q29, decision 438)", "heading": {"sid": "smp161-S592", "en": "Crowd density, danger signs and surge moments", "ar": "كثافة الحشود وعلامات الخطر ولحظات الاندفاع"}, "kicker": {"sid": "smp161-S593", "en": "A rule of thumb you must know", "ar": "قاعدة عملية يجب أن تعرفوها"}, "lines": [{"sid": "smp161-S594", "en": "Swaying or waves in a crowd = dangerous density. Report urgently.", "ar": "تمايل أو موجات في الحشد = كثافة خطرة. بلّغوا بشكل عاجل."}], "x_lineIcons": [{"icon": "warning"}], "safetyCritical": true, "xp": {"complete": 5}}, {"id": "4.8", "section": "4", "lo": [4], "type": "mcq", "x_part": 8, "bloom": "apply", "safetyCritical": true, "a11y": {"alternative": "Every choice is a labelled button; screen readers read the text.", "state": "Right and wrong are shown with ✓ / ✕ and words, never colour alone."}, "x_unsco ": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 12 GOLDEN RULES 1-3", "heading": {"sid": "smp161-S607", "en": "Conflict management and de-escalation", "ar": "إدارة النزاعات وتهدئتها"}, "kicker": {"sid": "smp161-S608", "en": "Lesson 9.2 · Golden rules", "ar": "الدرس 9.2 · القواعد الذهبية"}, "lines": [{"sid": "smp161-S609", "en": "Marshal's line: OBSERVE → CALM WITH WORDS → REPORT → ESCALATE. Never physical.", "ar": "خط المنظِّم: راقب → هدّئ بالكلام → أبلغ → صعّد. لا تدخّل جسدي أبدًا."}, {"sid": "smp161-S610", "en": "NEVER touch, hold, block or remove anyone.", "ar": "لا تلمس أحدًا أبدًا ولا تمسكه ولا تحاصره ولا تُخرجه."}, {"sid": "smp161-S611", "en": "Red signs? Step back NOW and call Security.", "ar": "علامات حمراء؟ تراجعوا الآن ونادوا الأمن."}], "x_lineIcons": [{"icon": "megaphone"}, {"icon": "raised hand"}, {"icon": "star"}], "xp": {"complete": 5}, "media": ["smp161-p12"]}, {"id": "4.10", "section": "4", "lo": [4], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 12 GOLDEN RULES 4-4; x_info = Part 12 RULES OF THUMB and POINTS TO REMEMBER, word for word, optional (decision 438)", "heading": {"sid": "smp161-S612", "en": "Conflict management and de-escalation", "ar": "إدارة النزاعات وتهدئتها"}, "kicker": {"sid": "smp161-S613", "en": "Lesson 9.2 · Golden rules", "ar": "الدرس 9.2 · القواعد الذهبية"}, "lines": [{"sid": "smp161-S614", "en": "Never take items. Flare? Don't touch, report. A lit flare = Incident White.", "ar": "لا تأخذ الأغراض أبدًا. شعلة نارية؟ لا تلمسها، أبلغ. شعلة مشتعلة = «حادث أبيض»."}], "x_lineIcons": [{"icon": "raised hand"}], "xp": {"complete": 5}, "x_info": {"label": {"sid": "smp161-S615", "en": "More to remember", "ar": "المزيد للتذكّر"}, "title": {"sid": "smp161-S616", "en": "Conflict management and de-escalation: more to remember", "ar": "إدارة النزاعات وتهدئتها: المزيد للتذكّر"}, "groups": [{"title": {"sid": "smp161-S617", "en": "Rules of thumb", "ar": "قواعد عملية"}, "icon": "thumbs up", "lines": [{"sid": "smp161-S618", "en": "L.E.A.P.: Listen (let them speak) - Empathise ('I understand...') - Ask (helpful questions) - Propose (give options).", "ar": "L.E.A.P.: L - استمع (دعهم يتكلمون) - E - تعاطف («أفهمك...») - A - اسأل (أسئلة مفيدة) - P - اقترح (قدّم خيارات)."}, {"sid": "smp161-S619", "en": "Escalation stages: Frustration → Anger → Aggression → Violence. Act early - it is easier.", "ar": "مراحل التصعيد: الإحباط → الغضب → العدوانية → العنف. تصرّفوا مبكرًا - فذلك أسهل."}, {"sid": "smp161-S620", "en": "Stand side-on, hands open, 1-3 metres away. Keep a way out. Never corner anyone.", "ar": "قف بزاوية جانبية، الأيدي مفتوحة، على بُعد 1-3 أمتار. أبقِ مخرجًا. لا تحاصر أحدًا في زاوية أبدًا."}, {"sid": "smp161-S621", "en": "Work in pairs: contact and cover.", "ar": "اعمل في ثنائيات: المتحدث والمساند."}, {"sid": "smp161-S622", "en": "Before you go in: TACT (Think, Assess, Consider, Take the safest action) and SEW (the E is Environment).", "ar": "قبل أن تتدخل: TACT (فكّر، قيّم، فكّر في الخيارات، اتخذ الإجراء الأكثر أمانًا) و SEW (حرف E يعني البيئة)."}, {"sid": "smp161-S623", "en": "Stuck? Use an exit line: 'Let me check that with my supervisor - I'll be right back.'", "ar": "عالق؟ استخدم عبارة انسحاب: «دعني أتحقق من ذلك مع المشرف - سأعود حالًا.»"}]}, {"title": {"sid": "smp161-S624", "en": "Points to remember", "ar": "نقاط للتذكّر"}, "icon": "round pushpin", "lines": [{"sid": "smp161-S625", "en": "Say: 'I can see you're upset' | 'Let me find out' | 'This way, please'.", "ar": "قل: «أرى أنك منزعج» | «دعني أتحقق لك» | «تفضل من هنا»."}, {"sid": "smp161-S626", "en": "Don't say: 'Calm down!' | 'Rules are rules' | 'Not my problem'.", "ar": "لا تقل: «اهدأ!» | «القواعد قواعد» | «ليست مشكلتي»."}, {"sid": "smp161-S627", "en": "Assertive = polite, firm, a reason and an option.", "ar": "الحازم بلباقة = مهذب، ثابت، يذكر السبب ويقدم خيارًا."}, {"sid": "smp161-S628", "en": "Laughing at someone in front of their friends is a common trigger.", "ar": "الضحك على شخص أمام أصدقائه محفز شائع."}, {"sid": "smp161-S629", "en": "Slow scanners? Walk the queue, explain, say how long, say sorry.", "ar": "أجهزة المسح بطيئة؟ امشوا على طول الطابور، واشرحوا، وقولوا كم سيستغرق، واعتذروا."}, {"sid": "smp161-S630", "en": "After a stressful incident: tell your supervisor, write the incident card, take water and a short break.", "ar": "بعد حادث مرهق: أخبروا مشرفكم، واكتبوا بطاقة الحادث، واشربوا ماء وخذوا استراحة قصيرة."}]}]}}, {"id": "4.11", "section": "4", "lo": [4], "type": "mcq", "x_part": 12, "bloom": "apply", "safetyCritical": false, "a11y": {"alternative": "Every choice is a labelled button; screen readers read the text.", "state": "Right and wrong are shown with ✓ / ✕ and words, never colour alone."}, "x_unscored": true, "src": "SMP 9.2 approved lesson-check bank, item Q17, word for word (smp92-conflict-deescalation); not one of the 60 (similarity to the nearest test question 0.10)", "kicker": {"sid": "smp161-S631", "en": "Quick check · Lesson 9.2", "ar": "تحقّق سريع · الدرس 9.2"}, "task": {"sid": "smp161-S632", "en": "Gate scanners are slow and the queue is getting restless. What is the best thing to do?", "ar": "ماسحات البوابة بطيئة والطابور بدأ يتململ. ما أفضل ما يمكن فعله؟"}, "options": [{"text": {"sid": "smp161-S633", "en": "Walk the queue, explain the delay, say how long and say sorry", "ar": "امشوا على طول الطابور، واشرحوا سبب التأخير، وقولوا كم سيستغرق، واعتذروا"}, "score": 2, "feedback": {"sid": "smp161-S634", "en": "PART: reduce frustration by keeping people informed.", "ar": "PART: قلّلوا الإحباط بإبقاء الناس على اطلاع."}}, {"text": {"sid": "smp161-S635", "en": "Wait until someone complains, then explain the delay", "ar": "انتظر حتى يشتكي أحد، ثم اشرح سبب التأخير"}, "score": 0, "feedback": {"sid": "smp161-S636", "en": "PART: reduce frustration by keeping people informed.", "ar": "PART: قلّلوا الإحباط بإبقاء الناس على اطلاع."}}, {"text": {"sid": "smp161-S637", "en": "Tell people to stop complaining and keep the queue moving", "ar": "اطلب من الناس التوقف عن الشكوى وأبقِ الطابور متحركًا"}, "score": 0, "feedback": {"sid": "smp161-S638", "en": "PART: reduce frustration by keeping people informed.", "ar": "PART: قلّلوا الإحباط بإبقاء الناس على اطلاع."}}, {"text": {"sid": "smp161-S639", "en": "Close the gate until the scanners are fixed", "ar": "أغلق البوابة حتى يتم إصلاح أجهزة المسح"}, "score": 0, "feedback": {"sid": "smp161-S640", "en": "PART: reduce frustration by keeping people informed.", "ar": "PART: قلّلوا الإحباط بإبقاء الناس على اطلاع."}}], "x_review": {"lesson": "9.2", "title": {"sid": "smp161-S641", "en": "Conflict management & de-escalation at football", "ar": "إدارة النزاعات وتهدئتها في مباريات كرة القدم"}, "aid": {"sid": "smp161-S642", "en": "WALK AWAY - AND AFTERWARDS", "ar": "انسحب - وما بعد ذلك"}}, "xp": {"complete": 5}}, {"id": "4.12", "section": "4", "lo": [4], "type": "sectionClose", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Golden rule (stage takeaway); job aid from the guide", "xp": {"complete": 10}, "takeaway": {"sid": "smp161-S643", "en": "Face the crowd, not the match.", "ar": "واجهوا الحشود، لا المباراة."}, "x_jobAid": {"title": {"sid": "smp161-S644", "en": "Pocket check: before gates open", "ar": "قائمة تحقق للجيب: قبل فتح البوابات"}, "steps": [{"sid": "smp161-S645", "en": "Signed in, kit collected, radio check done (\"loud and clear\").", "ar": "تم تسجيل الحضور، واستلام المعدات، وأُجري فحص الاتصال («واضح ومسموع»)."}, {"sid": "smp161-S646", "en": "Written down: my post, supervisor call sign, Area Leader, break/prayer slot.", "ar": "تم تدوين: موقعي، رمز نداء المشرف، قائد المنطقة، موعد الاستراحة/الصلاة."}, {"sid": "smp161-S647", "en": "I know my nearest exit, first aid point, AED, assembly point and Info Point.", "ar": "أعرف أقرب مخرج لي، ونقطة الإسعافات الأولية، وجهاز الصدمات (AED)، ونقطة التجمع، ونقطة المعلومات."}, {"sid": "smp161-S648", "en": "Area swept: exits clear, no hazards. Reported \"area clear\".", "ar": "تم تفقد المنطقة: المخارج خالية، ولا مخاطر. تم الإبلاغ: «المنطقة آمنة وخالية»."}]}}, {"id": "5.1", "section": "5", "lo": [5], "type": "teach", "src": "DECISION 438 day story (ours, R2): stage 5 opening; facts from the guide parts of this stage", "heading": {"sid": "smp161-S649", "en": "When something goes wrong", "ar": "عندما يحدث خطأ"}, "media": ["smp161-s5"], "lines": [{"sid": "smp161-S650", "en": "It can happen at any moment of your day.", "ar": "قد يحدث ذلك في أي لحظة من يومكم."}, {"sid": "smp161-S651", "en": "Stay calm. You know who leads, and you know what to do.", "ar": "حافظوا على هدوئكم. تعرفون من يتولّى القيادة، وتعرفون ما عليكم فعله."}], "x_lineIcons": [{"icon": "star"}, {"icon": "light bulb"}], "xp": {"complete": 5}}, {"id": "5.2", "section": "5", "lo": [5], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 7 GOLDEN RULES 1-3", "heading": {"sid": "smp161-S652", "en": "Working with MOI and Civil Defence, and fire safety", "ar": "العمل مع وزارة الداخلية والدفاع المدني، والسلامة من الحرائق"}, "kicker": {"sid": "smp161-S653", "en": "Lessons 5.1 and 5.2 · Golden rules", "ar": "الدرسان 5.1 و5.2 · القواعد الذهبية"}, "lines": [{"sid": "smp161-S654", "en": "Fire, smoke, gas, structure damage → Civil Defence lead.", "ar": "الحريق أو الدخان أو الغاز أو الأضرار الهيكلية → يتولى الدفاع المدني القيادة."}, {"sid": "smp161-S655", "en": "Suspicious item, threat, fight, disorder, refusing to leave → Police (MOI) with Security.", "ar": "غرض مشبوه أو تهديد أو شجار أو إخلال بالنظام أو رفض المغادرة → الشرطة (وزارة الداخلية) بالتعاون مع الأمن."}, {"sid": "smp161-S656", "en": "Sick or injured → Red Crescent with Civil Defence.", "ar": "مريض أو مصاب → الهلال الأحمر بالتعاون مع الدفاع المدني."}], "x_lineIcons": [{"icon": "fire"}, {"icon": "backpack"}, {"icon": "red crescent"}], "xp": {"complete": 5}, "media": ["smp161-p7"]}, {"id": "5.3", "section": "5", "lo": [5], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 7 GOLDEN RULES 4-4; x_info = Part 7 RULES OF THUMB and POINTS TO REMEMBER, word for word, optional (decision 438)", "heading": {"sid": "smp161-S657", "en": "Working with MOI and Civil Defence, and fire safety", "ar": "العمل مع وزارة الداخلية والدفاع المدني، والسلامة من الحرائق"}, "kicker": {"sid": "smp161-S658", "en": "Lessons 5.1 and 5.2 · Golden rules", "ar": "الدرسان 5.1 و5.2 · القواعد الذهبية"}, "lines": [{"sid": "smp161-S659", "en": "Raise the alarm first. Never put yourself at risk.", "ar": "أطلقوا الإنذار أولًا. لا تعرّضوا أنفسكم للخطر أبدًا."}], "x_lineIcons": [{"icon": "no entry"}], "xp": {"complete": 5}, "x_info": {"label": {"sid": "smp161-S660", "en": "More to remember", "ar": "المزيد للتذكّر"}, "title": {"sid": "smp161-S661", "en": "Working with MOI and Civil Defence, and fire safety: more to remember", "ar": "العمل مع وزارة الداخلية والدفاع المدني، والسلامة من الحرائق: المزيد للتذكّر"}, "groups": [{"title": {"sid": "smp161-S662", "en": "Rules of thumb", "ar": "قواعد عملية"}, "icon": "thumbs up", "lines": [{"sid": "smp161-S663", "en": "Response steps: 1) Stay safe. 2) Report. 3) Keep people back and routes clear. 4) Follow the lead agency. 5) Hand over: what you saw, where, who, any hazards, and what you have NOT confirmed.", "ar": "خطوات الاستجابة: 1) ابقوا في أمان. 2) أبلغوا. 3) أبقوا الناس بعيدًا والمسارات خالية. 4) اتبعوا الجهة القائدة. 5) سلّموا: ما رأيتموه، وأين، ومن، وأي مخاطر، وما لم تتأكدوا منه."}, {"sid": "smp161-S664", "en": "Fire check before gates open - E-X-I-T-S: Exits clear and unlocked, eXtinguishers in place, Ignition sources safe, Trash cleared, Signs lit and fire doors closed.", "ar": "فحص الحريق قبل فتح البوابات - E-X-I-T-S: E - المخارج خالية وغير مقفلة، X - الطفايات في مكانها، I - مصادر الاشتعال آمنة، T - النفايات مُزالة، S - اللافتات مضاءة وأبواب الحريق مغلقة."}, {"sid": "smp161-S665", "en": "Fire or smoke - R.I.E.F.A.: Raise the alarm ('Incident White'), Inform, Ensure people move away, Fight only if authorised and trained and safe, Assist Civil Defence.", "ar": "حريق أو دخان - R.I.E.F.A.: R - أطلقوا الإنذار («حادث أبيض»)، I - أبلغوا، E - تأكدوا من ابتعاد الناس، F - كافحوا الحريق فقط إذا كنتم مخوَّلين ومدرَّبين وفي أمان، A - ساعدوا الدفاع المدني."}, {"sid": "smp161-S666", "en": "Extinguisher use - P.A.S.S.: Pull, Aim low, Squeeze, Sweep. Then back away facing the fire.", "ar": "استخدام الطفاية - P.A.S.S.: P - اسحبوا، A - صوّبوا إلى الأسفل، S - اضغطوا، S - حرّكوا من جانب إلى جانب. ثم تراجعوا ووجوهكم نحو الحريق."}, {"sid": "smp161-S667", "en": "Read the extinguisher LABEL, not the colour.", "ar": "اقرؤوا ملصق الطفاية، لا لونها."}]}, {"title": {"sid": "smp161-S668", "en": "Points to remember", "ar": "نقاط للتذكّر"}, "icon": "round pushpin", "lines": [{"sid": "smp161-S669", "en": "Fire doors are never wedged open and never locked.", "ar": "أبواب الحريق لا تُسند لتبقى مفتوحة أبدًا ولا تُقفل أبدًا."}, {"sid": "smp161-S670", "en": "Locked or blocked exit? Report it and stay with it from a safe position.", "ar": "مخرج مقفل أو مسدود؟ أبلغوا عنه وابقوا بالقرب منه في مكان آمن."}, {"sid": "smp161-S671", "en": "Small, safe hazard (like litter)? Fix it and tell your supervisor. Not safe? Report it now.", "ar": "خطر صغير يمكن معالجته بأمان (مثل النفايات)؟ عالجوه وأخبروا مشرفكم. غير آمن؟ أبلغوا عنه الآن."}, {"sid": "smp161-S672", "en": "Completing the e-learning does NOT authorise you to use an extinguisher.", "ar": "إكمال التعلم الإلكتروني لا يخوّلكم استخدام الطفاية."}, {"sid": "smp161-S673", "en": "No rumours. No filming or posting on duty.", "ar": "لا إشاعات. لا تصوير ولا نشر أثناء العمل."}]}]}}, {"id": "5.4", "section": "5", "lo": [5], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 7 RULES OF THUMB (required: behind safety-critical test question Q25, decision 438)", "heading": {"sid": "smp161-S674", "en": "Working with MOI and Civil Defence, and fire safety", "ar": "العمل مع وزارة الداخلية والدفاع المدني، والسلامة من الحرائق"}, "kicker": {"sid": "smp161-S675", "en": "A rule of thumb you must know", "ar": "قاعدة عملية يجب أن تعرفوها"}, "lines": [{"sid": "smp161-S676", "en": "Fire or smoke موا الناس وأبلغوا في أقرب لحظة آمنة - فهما يحدثان معًا."}}, {"text": {"sid": "smp161-S683", "en": "Go and fight the fire", "ar": "اذهبوا وأطفئوا الحريق"}, "score": 0, "feedback": {"sid": "smp161-S684", "en": "Danger in front of you: protect people and report at the earliest safe moment - they happen together.", "ar": "خطر أمامكم: احموا الناس وأبلغوا في أقرب لحظة آمنة - فهما يحدثان معًا."}}, {"text": {"sid": "smp161-S685", "en": "Leave your area", "ar": "اتركوا منطقتكم"}, "score": 0, "feedback": {"sid": "smp161-S686", "en": "Danger in front of you: protect people and report at the earliest safe moment - they happen together.", "ar": "خطر أمامكم: احموا الناس وأبلغوا في أقرب لحظة آمنة - فهما يحدثان معًا."}}], "x_review": {"lesson": "5.1", "title": {"sid": "smp161-S687", "en": "MOI & Civil Defence briefing: security, legal limits & major incidents", "ar": "إحاطة وزارة الداخلية والأمن والدفاع المدني: الأمن والحدود القانونية والحوادث الكبرى"}, "aid": {"sid": "smp161-S688", "en": "My response steps", "ar": "خطوات استجابتي"}}, "xp": {"complete": 5}}, {"id": "5.6", "section": "5", "lo": [5], "type": "mcq", "x_part": 7, "bloom": "apply", "safetyCritical": true, "a11y": {"alternative": "Every choice is a labelled button; screen readers read the text.", "state": "Right and wrong are shown with ✓ / ✕ and words, never colour alone."}, "x_unscored": true, "src": "SMP 5.2 approved lesson-check bank, item Q09, word for word (smp52-fire-safety); not one of the 60 (similarity to the nearest test question 0.06)", "kicker": {"sid": "smp161-S689", "en": "Quick check · Lesson 5.2", "ar": "تحقّق سريع · الدرس 5.2"}, "task": {"sid": "smp161-S690", "en": "A small fire is burning in a bin and an extinguisher hangs on the wall next to you. What do you do?", "ar": "حريق صغير يشتعل في سلة نفايات، وطفاية حريق معلّقة على الجدار بجانبكم. ماذا تفعلون؟"}, "options": [{"text": {"sid": "smp161-S691", "en": "Pick it up and put the fire out", "ar": "احملوها وأطفئوا الحريق"}, "score": 0, "feedback": {"sid" ذهبية"}, "lines": [{"sid": "smp161-S703", "en": "RECOGNISE - DON'T INVESTIGATE - REPORT.", "ar": "لاحظ - لا تحقق بنفسك - أبلغ."}, {"sid": "smp161-S704", "en": "Danger right now? Call the nearest Security or police, then report. Never chase or grab.", "ar": "خطر الآن؟ نادوا أقرب فرد من الأمن أو الشرطة، ثم أبلغوا. لا تطاردوا ولا تمسكوا أحدًا أبدًا."}, {"sid": "smp161-S705", "en": "Hand over a found person ONLY through your supervisor.", "ar": "سلّموا الشخص الذي عُثر عليه عبر مشرفكم فقط."}], "x_lineIcons": [{"icon": "megaphone"}, {"icon": "warning"}, {"icon": "speaking head"}], "xp": {"complete": 5}, "media": ["smp161-p13"]}, {"id": "5.8", "section": "5", "lo": [5], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 13 GOLDEN RULES 4-4; x_info = Part 13 RULES OF THUMB and POINTS TO REMEMBER, word for word, optional (decision 438)", "heading": {"sid": "smp161-S706", "en": "Safeguarding and lost persons", "ar": "الحماية والأشخاص المفقودون"}, "kicker": {"sid": "smp161-S707", "en": "Lesson 9.3 · Golden rules", "ar": "الدرس 9.3 · القواعد الذهبية"}, "lines": [{"sid": "smp161-S708", "en": "No names on open radio. No photos. Nothing on your phone or social media.", "ar": "لا أسماء عبر اللاسلكي المفتوح. لا صور. لا شيء على هاتفكم أو وسائل التواصل الاجتماعي."}], "x_lineIcons": [{"icon": "radio"}], "xp": {"complete": 5}, "x_info": {"label": {"sid": "smp161-S709", "en": "More to remember", "ar": "المزيد للتذكّر"}, "title": {"sid": "smp161-S710", "en": "Safeguarding and lost persons: more to remember", "ar": "الحماية والأشخاص المفقودون: المزيد للتذكّر"}, "groups": [{"title": {"sid": "smp161-S711", "en": "Rules of thumb", "ar": "قواعد عملية"}, "icon": "thumbs up", "lines": [{"sid": "smp161-S712", "en": "Someone is LOST: calm the person reporting → get a description (age, boy/girl, height, hair, clothes, name, where and when last seen) → look around your area (stay at post) → call your supervisor.", "ar": "شخص مفقود: هدّئوا الشخص المُبلِّغ → خذوا الأوصاف (العمر، ولد/بنت، الطول، الشعر، الملابس، الاسم، وأين ومتى شوهد آخر مرة) → انظروا حول منطقتكم (ابقوا في موقعكم) → اتصلوا بمشرفكم."}, {"sid": "smp161-S713", "en": "Someone is FOUND: introduce yourself ('I work for the event') → check for an ID wristband → girl or woman? get a female colleague → stay with them, same place, in public view → call your supervisor.", "ar": "شخص عُثر عليه: عرّفوا بأنفسكم («أنا أعمل في الفعالية») → تحققوا من وجود سوار تعريف → فتاة أو امرأة؟ اطلبوا زميلة → ابقوا معه، في المكان نفسه، على مرأى من الناس → اتصلوا بمشرفكم."}, {"sid": "smp161-S714", "en": "The supervisor takes over the 15-minute protocol.", "ar": "المشرف يتولى بروتوكول الـ 15 دقيقة."}]}, {"title": {"sid": "smp161-S715", "en": "Points to remember", "ar": "نقاط للتذكّر"}, "icon": "round pushpin", "lines": [{"sid": "smp161-S716", "en": "A child seems frightened of an adult? Keep them in sight and report the facts at once. Don't ask the adult to prove anything.", "ar": "طفل يبدو خائفًا من شخص بالغ؟ أبقوهما في مرمى بصركم وأبلغوا بالحقائق فورًا. لا تطلبوا من البالغ إثبات أي شيء."}, {"sid": "smp161-S717", "en": "A woman reports harassment? Listen, reassure, report at once, and ask a female colleague.", "ar": "امرأة تبلّغ عن تحرش؟ استمعوا، وطمئنوها، وأبلغوا فورًا، واطلبوا زميلة."}]}]}}, {"id": "5.9", "section": "5", "lo": [5], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 13 RULES OF THUMB (required: behind safety-critical test question Q47, decision 438)", "heading": {"sid": "smp161-S718", "en": "Safeguarding and lost persons", "ar": "الحماية والأشخاص المفقودون"}, "kicker": {"sid": "smp161-S719", "en": "A rule of thumb you must know", "ar": "قاعدة عملية يجب أن تعرفوها"}, "lines": [{"sid": "smp161-S720", "en": "Someone is FOUND: introduce yourself ('I work for the event') → check for an ID wristband → girl or woman? get a female colleague → stay with them, same place, in public view → call your supervisor.", "ar": "شخص عُثر عليه: عرّفوا بأنفسكم («أنا أعمل في الفعالية») → تحققوا من وجود سوار تعريف → فتاة أو امرأة؟ اطلبوا زميلة → ابقوا معه، في المكان نفسه، على مرأى من الناس → اتصلوا بمشرفكم."}], "x_lineIcons": [{"icon": "speaking head"}], "safetyCritical": true, "xp": {"complete": 5}}, {"id": "5.10", "section": "5", "lo": [5], "type": "mcq", "x_part": 13, "bloom": "apply", "safetyCritical": true, "a11y": {"alternative": "Every choice is a labelled button; screen readers read the text.", "state": "Right and wrong are shown with ✓ / ✕ and words, never colour alone."}, "x_unscored": true, "src": "SMP 9.3 approved lesson-check bank, item Q01, word for word (smp93-safeguarding-lost-persons); not one of the 60 (similarity to the nearest test question 0.09)", "kicker": {"sid": "smp161-S721", "en": "Quick check · Lesson 9.3", "ar": "تحقّق سريع · الدرس 9.3"}, "task": {"sid": "smp161-S722", "en": "A mother tells you her son is missing. You have calmed her and taken his description. What do you do next?", "ar": "أمٌّ تخبركم أن ابنها مفقود. هدّأتموها وأخذتم أوصافه. ماذا تفعلون بعد ذلك؟"}, "options": [{"text": {"sid": "smp161-S723", "en": "Look quickly around your area, then call your supervisor", "ar": "النظر بسرعة حول منطقتكم، ثم الاتصال بالمشرف"}, "score": 2, "feedback": {"sid": "smp161-S724", "en": "Calm - describe - look - call - note. Then note her name and seat number and ask her to stay.", "ar": "هدّئوا - صِفوا - انظروا - اتصلوا - سجّلوا. ثم سجّلوا اسمها ورقم مقعدها واطلبوا منها البقاء."}}, {"text": {"sid": "smp161-S725", "en": "Leave your post and search the whole stadium for him yourself", "ar": "ترك موقعكم والبحث عنه في الملعب كله بأنفسكم"}, "score": 0, "feedback": {"sid": "smp161-S726", "en": "Stay at your post. Your area still needs you.", "ar": "ابقوا في موقعكم. منطقتكم ما زالت بحاجة إليكم."}}, {"text": {"sid": "smp161-S727", "en": "Radio his full name so every marshal can start looking for him", "ar": "إبلاغ اسمه الكامل عبر اللاسلكي ليبدأ كل منظم بالبحث عنه"}, "score": 0, "feedback": {"sid": "smp161-S728", "en": "Fans can hear radios. Keep his name off open radio.", "ar": "المشجعون يسمعون أجهزة اللاسلكي. أبقوا اسمه بعيدًا عن اللاسلكي المفتوح."}}, {"text": {"sid": "smp161-S729", "en": "Walk her to the Info Point and ask the staff there to find him", "ar": "مرافقتها إلى نقطة المعلومات وطلب البحث عنه من الموظفين هناك"}, "score": 0, "feedback": {"sid": "smp161-S730", "en": "Stay in the same place and call your supervisor.", "ar": "ابقوا في المكان نفسه واتصلوا بالمشرف."}}], "x_review": {"lesson": "9.3", "title": {"sid": "smp161-S731", "en": "Safeguarding & lost persons", "ar": "الحماية والأشخاص المفقودون"}, "aid": {"sid": "smp161-S732", "en": "SOMEONE IS LOST", "ar": "شخص مفقود"}}, "xp": {"complete": 5}}, {"id": "5.11", "section": "5", "lo": [5], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 14 GOLDEN RULES 1-3", "heading": {"sid": "smp161-S733", "en": "Suspicious items, evacuation and public alerts", "ar": "الأغراض المشبوهة والإخلاء والتنبيهات العامة"}, "kicker": {"sid": "smp161-S734", "en": "Lessons 10.1, 10.2 and 10.3 · Golden rules", "ar": "الدروس 10.1 و10.2 و10.3 · القواعد الذهبية"}, "lines": [{"sid": "smp161-S735", "en": "Suspicious item: DON'T TOUCH - STEP BACK - REPORT. Never touch, move, open or cover it.", "ar": "غرض مشبوه: لا تلمسوه - ابتعدوا - أبلغوا. لا تلمسوه ولا تحرّكوه ولا تفتحوه ولا تغطّوه أبدًا."}, {"sid": "smp161-S736", "en": "Step back at least 15 metres before using your radio or phone.", "ar": "ابتعدوا 15 مترًا على الأقل قبل استخدام جهاز اللاسلكي أو الهاتف."}, {"sid": "smp161-S737", "en": "Say 'Item of Interest'. Never say 'bomb'.", "ar": "قولوا «غرض محل اهتمام». لا تقولوا «قنبلة» أبدًا."}], "x_lineIcons": [{"icon": "raised hand"}, {"icon": "radio"}, {"icon": "backpack"}], "xp": {"complete": 5}, "media": ["smp161-p14"]}, {"id": "5.12", "section": "5", "lo": [5], "type": "teach", "src": "CLIENT AFC27 SMP Marshal Study Guide.docx Part 14 GOLDEN RULES 4-5; x_info = Part 14 RULES OF THUMB and POINTS TO REMEMBER, word for word, optional (decision 438)", "heading": {"sid": "smp161-S738", "en": "Suspicious items, evacuation and public alerts", "ar": "الأغراض المشبوهة والإخلاء والتنبيهات العامة"}, "kicker": {"sid": "smp161-S739", "en": "Lessons 10.1, 10.2 and 10.3 · Golden rules", "ar": "الدروس 10.1 و10.2 و10.3 · القواعد الذهبية"}, "lines": [{"sid": "smp161-S740", "en": "Evacuation: NO LIFTS. NO GOING BACK.", "ar": "الإخلاء: لا تستخدموا المصاعد. لا تعودوا إلى الداخل."}, {"sid": "smp161-S741", "en": "Open exit gates ONLY on instruction.", "ar": "افتحوا بوابات المخارج عند تلقي التعليمات فقط."}], "x_lineIcons": [{"icon": "lift sign"}, {"icon": "exit sign"}], "xp": {"complete": 5}, "x_info": {"label": {"sid": "smp161-S742", "en": "More to remember", "ar": "المزيد للتذكّر"}, "title": {"sid": "smp161-S743", "en": "Suspicious items, evacuation and public alerts: more to remember", "ar": "الأغراض المشبوهة والإخلاء والتنبيهات العامة: المزيد للتذكّر"}, "groups": [{"title": {"sid": "smp161-S744", "en": "Rules of thumb", "ar": "قواعد عملية"}, "icon": "thumbs up", "lines": [{"sid": "smp161-S745", "en": "HOT (look only): Hidden? Obviously suspicious (wires, batteries, tape, liquid, smell)? Typical for a match?", "ar": "HOT (بالنظر فقط): مخفي؟ مشبوه بشكل واضح (أسلاك، بطاريات، شريط لاصق، سائل، رائحة)؟ معتاد في مباراة؟"}, {"sid": "smp161-S746", "en": "Most bags are lost property. Stay calm. Ask: 'Is this yours? Did you see who left it?'", "ar": "معظم الحقائب مفقودة. حافظوا على هدوئكم. اسألوا: «هل هذا لك؟ هل رأيت من تركه؟»"}, {"sid": "smp161-S747", "en": "Keep the person who found it with you. Keep people back only on instruction.", "ar": "أبقوا الشخص الذي وجده معكم. أبعدوا الناس عند تلقي التعليمات فقط."}, {"sid": "smp161-S748", "en": "STAND-BY message = GET READY: go to your evacuation post, check exits are clear, say nothing to fans yet.", "ar": "رسالة الاستعداد = استعدّوا: اذهبوا إلى موقع الإخلاء، وتحققوا من أن المخارج خالية، ولا تقولوا شيئًا للمشجعين بعد."}, {"sid": "smp161-S749", "en": "EVACUATE message = GO: open gate fully, stand to the side, loud voice, big signals, control the pace at stair heads.", "ar": "رسالة الإخلاء = تحرّكوا: افتحوا البوابة بالكامل، وقفوا جانبًا، بصوت عالٍ وإشارات كبيرة، وتحكّموا في سرعة الحركة عند رؤوس الدرج."}, {"sid": "smp161-S750", "en": "Sweep toilets, ablution areas and prayer rooms if safe, then follow the last fan out.", "ar": "تفقّدوا دورات المياه ومناطق الوضوء وغرف الصلاة إذا كان ذلك آمنًا، ثم اتبعوا آخر مشجع إلى الخارج."}]}, {"title": {"sid": "smp161-S751", "en": "Points to remember", "ar": "نقاط للتذكّر"}, "icon": "round pushpin", "lines": [{"sid": "smp161-S752", "en": "The Police lead suspicious-item incidents. Civil Defence command fire and evacuation.", "ar": "الشرطة تقود حوادث الأغراض المشبوهة. الدفاع المدني يتولى قيادة الحرائق والإخلاء."}, {"sid": "smp161-S753", "en": "Damaged barrier? Ask fans to step off it and report straight away.", "ar": "حاجز متضرر؟ اطلبوا من المشجعين الابتعاد عنه وأبلغوا عنه فورًا."}, {"sid": "smp161-S754", "en": "At the assembly point, tell your supervisor if anyone may still be inside.", "ar": "في نقطة التجمع، أبلغوا مشرفكم إذا كان من المحتمل أن يبقى أحد في الداخل."}, {"sid": "smp161-S755", "en": "Keep code words confidential.", "ar": "حافظوا على سرية الكلمات الرمزية."}, {"sid": "smp161-S756", "en": "Public alert: stay calm, go to the nearest safe place inside, away from glass, avoid open areas, don't film, stay until the all-clear.", "ar": "تنبيه عام: حافظوا على هدوئكم، واذهبوا إلى أقرب مكان آمن في الداخل، بعيدًا عن الزجاج، وتجنبوا المناطق المفتوحة، ولا تصوّروا، وابقوا حتى رسالة انتهاء الخطر."}, {"sid": "smp161-S757", "en": "Shelter instruction: lead fans calmly to the shelter area. Help children, older fans and disabled fans first.", "ar": "تعليمات الاحتماء: قودوا المشجعين بهدوء إلى منطقة الاحتماء. ساعدوا الأطفال وكبار السن والمشجعين من ذوي الإعاقة أولًا."}, {"sid": "smp161-S758", "en": "Fan asks 'Is it a missile?' Say: 'You're safe with us - please come inside with me.'", "ar": "مشجع يسأل «هل هو صاروخ؟» قولوا: «أنت بأمان معنا - تفضل معي إلى الداخل من فضلك.»"}, {"sid": "smp161-S759", "en": "All-clear? Wait for the instruction to move. Leaving may be block by block.", "ar": "انتهى الخطر؟ انتظروا التعليمات بالتحرك. قد تكون المغادرة قطاعًا بعد قطاع."}]}]}}, {"id": "5.13", "section": "5", "lo": [5], "type": "mcq", "x_part": 14, "bloom": "apply", "safetyCritical": true, "a11y": {"alternative": "Every choice is a labelled button; screen readers read the text.", "state": "Right and wrong are shown with ✓ / ✕ and words, never colour alone."}, "x_unscored": true, "src": "SMP 10.1 approved lesson-check bank, item Q04, word for word (smp101-suspicious-items-hazard-response); not one of the 60 (similarity to the nearest test question 0.07)", "kicker": {"sid": "smp161-S760", "en": "Quick check · Lesson 10.1", "ar": "تحقّق سريع · الدرس 10.1"}, "task": {"sid": "smp161-S761", "en": "How do you check an item with HOT?", "ar": "كيف تتحققون من غرض باستخدام HOT؟"}, "options": [{"text": {"sid": "smp161-S762", "en": "By lifting it to feel the weight", "ar": "برفعه لمعرفة وزنه"}, "score": 0, "feedback": {"sid": "smp161-S763", "en": "Look only. Police and specialists deal with the item.", "ar": "انظروا فقط. الشرطة والمختصون يتعاملون مع الغرض."}}, {"text": {"sid": "smp161-S764", "en": "By looking only - never touching, moving or opening it", "ar": "بالنظر فقط - دون لمسه أو تحريكه أو فتحه أبدًا"}, "score": 2, "feedback": {"sid": "smp161-S765", "en": "Look only. Police and specialists deal with the item.", "ar": "انظروا فقط. الشرطة والمختصون يتعاملون مع الغرض."}}, {"text": {"sid": "smp161-S766", "en": "By opening it carefully", "ar": "بفتحه بحذر"}, "score": 0, "feedback": {"sid": "smp161-S767", "en": "Look only. Police and specialists deal with the item.", "ar": "انظروا فقط. الشرطة والمختصون يتعاملون مع الغرض."}}, {"text": {"sid": "smp161-S768", "en": "By asking a fan to open it", "ar": "بطلب فتحه من أحد المشجعين"}, "score": 0, "feedback": {"sid": "smp161-S769", "en": "Look only. Police and specialists deal with    ends the LMS session (LMSFinish) and closes the lesson window. An LMS that shows the lesson in its own page
   cannot be closed from the lesson, so a line on the screen says the lesson is done (user, 2026-11-12).
   2026-11-13 (user: 'the finish should report the score to the lms, and close the window'): the score goes to the LMS
   again with the result (the best score is kept), then a normal exit - the attempt is finished, not paused (suspend). */

/* ============ SCHEMA 2.0 ADAPTER ============
   The script skill (elearning-module-designer) writes script.json "schema 2.0":
     strings {sid, en, ar?}, section as string, one answer model (score 0/1/2), media = asset ids,
     consequence {outcome, why, next}, multiselect options[], imageTiles tiles[]{media, score, feedback},
     branch goto, order feedbackCorrect/feedbackWrong, placeholder {id, owner, note}, module.quiz, module.passMark {percent, display}.
   This file normalises such a script in place so the runtime (built for the earlier shape) renders it unchanged.
   Runs before buildFromScript(). Idempotent. */

function sc2_rating(o){if(o.rating)return o.rating;if('score' in o)return o.score===2?'best':o.score===1?'ok':'wrong';return o.correct===true?'best':'wrong';}
function sc2_assetFile(id,kind){
  if(!id||/\.(mp4|jpg|jpeg|png|webp|gif|svg)$/i.test(id))return id;
  var a=(COURSE.assets||{})[id];
  if(a&&a.file)return a.file;
  return id+(((a&&a.kind)==='video'||kind==='video')?'.mp4':'.jpg');
}
function adaptSchema2(S){
  if(!S||S.__adapted)return S;S.__adapted=true;
  var M=S.module||{};
  if(M.passMark&&typeof M.passMark==='object'){COURSE.passDisplay=M.passMark.display;}
  (M.sections||[]).forEach(function(sec){if(typeof sec.n==='string'&&/^\d+$/.test(sec.n))sec.n=+sec.n;});
  var Q=M.quiz||null;
  function fixMedia(s){
    if(!s.media)return;
    var arr=Array.isArray(s.media)?s.media:[s.media];
    s.media=arr.map(function(m){return sc2_assetFile(m,s.type==='video'?'video':null);});
  }
  function fixScreen(s){
    if(typeof s.section==='string'&&/^\d+$/.test(s.section))s.section=+s.section;
    fixMedia(s);
    (s.x_variants||[]).forEach(fixMedia);   /* a consequence variant's own picture is an asset id too (2026-11-09: it showed 'Picture coming soon') */
    if(s.placeholder&&typeof s.placeholder==='object'){s.x_placeholder=true;if(!s.x_placeholderNote)s.x_placeholderNote=s.placeholder.note||s.placeholder.id;}
    (s.options||[]).forEach(function(o){if(!o.rating)o.rating=sc2_rating(o);if(o.goto&&!o.goTo)o.goTo=o.goto;});
    switch(s.type){
      case 'multiselect':
        if(!s.items&&s.options){s.items=s.options.map(function(o){return {text:o.text,correct:sc2_rating(o)!=='wrong',icon:o.icon,why:o.feedback};});}
        if(s.feedbackCorrect&&!s.x_feedbackCorrect)s.x_feedbackCorrect=s.feedbackCorrect;
        break;
      case 'imageTiles':
        (s.tiles||[]).forEach(function(t){if(t.correct===undefined&&'score' in t)t.correct=t.score===2;if(!t.why&&t.feedback)t.why=t.feedback;if(t.media)t.media=sc2_assetFile(t.media,null);});
        break;
      case 'consequence':
        if(!s.headline&&s.outcome)s.headline=s.outcome;
        /* 'why' the same words as 'outcome' (the heading) is not shown twice (learner QA, 2026-11-04) */
        if(!s.lines&&s.why){var _sw=function(v){return v&&typeof v==='object'?String(v.en||'').trim():String(v||'').trim();};
          if(!(s.headline&&_sw(s.why)&&_sw(s.why)===_sw(s.headline)))s.lines=[s.why];}
        if(!s.tone)s.tone='mixed';
        if(s.next&&!s.x_next)s.x_next=s.next;
        break;
      case 'branch':
        if(!s.situation&&s.scene)s.situation=s.scene;
        break;
      case 'order':
        if(!s.okText&&s.feedbackCorrect)s.okText=s.feedbackCorrect;
        if(!s.noText&&s.feedbackWrong)s.noText=s.feedbackWrong;
        break;
      case 'moduleQuiz':
        if(Q){if(s.count===undefined)s.count=Q.itemsShown;if(s.passMark===undefined)s.passMark=Q.passPercent;if(s.retries===undefined)s.retries=Q.retries;if(s.feedbackAfterEach===undefined)s.feedbackAfterEach=Q.feedbackAfterEach!==false;
          if(s.perObjective===undefined)s.perObjective=Q.perObjective;if(s.shuffleOptions===undefined)s.shuffleOptions=Q.shuffleOptions;if(s.randomise===undefined)s.randomise=Q.randomise;if(s.minSafety===undefined)s.minSafety=Q.minSafety;if(s.safetyMustPass===undefined)s.safetyMustPass=Q.safetyMustPass;}
        if(!s.lines&&s.intro)s.lines=[s.intro];
        break;
      case 'flashcards':
        (s.cards||[]).forEach(function(c){if(c.media)c.media=sc2_assetFile(c.media,null);});
        break;
      case 'finalQuestion':
        if(typeof s.learnIn==='string'&&!s.learnInText)s.x_learnInCode=s.learnIn;
        break;
    }
  }
  (S.screens||[]).forEach(fixScreen);
  (S.quizPool||[]).forEach(function(q){fixScreen(q);if(!q.stem&&q.task)q.stem=q.task;});
  return S;
}

   Loaded after script-schema2.js. Adds, for any module:

/* ============ SCRIPT MECHANICS (part 6): many ways to play the same activity ============
   The same content (script.json) can be played with different mechanics, so a module never feels like
   "the same sort again". A screen picks one with `x_mechanic`; when it does not, the engine rotates through
   the mechanics that fit the content, seeded by the module id (different modules → different order).
   Every mechanic: buttons first (tap + keyboard; swipe/drag only as extras), mirrored in RTL, never timed,
   feedback says why, first-time-correct XP only when no mistake was made.

     sort        buckets (tap card → column) · deck (one card at a time, two big choices, swipe optional)
                 · belt (cards queue on a conveyor, send each to a bin) · stamps (a sheet: stamp every line, then check)
     mcq         list (option list) · tiles (2×2 picture-style tiles) · doors (side-by-side choices, ≤3 options)
                 · chat (reply bubbles; only when every option is something you say, in quotes)
     order       list (▲▼) · stack (tap the next step; cards pile up in order) · path (steps placed on a route)
     trueFalse   card (two buttons + swipe; the default, no rotation) · stamp (stamp on a paper) · thumbs (👍 / 👎 mark) — all with the same ✓ True / ✕ False buttons
     revealCards scene (glass cards over a scene, picture fixed, panel turns left-right; explicit only — script-types.js sceneCards)
     match       pairs (tap an item, then its partner) · memory (face-down cards, turn two at a time)  [new type]
     hotspot     findAll (several correct spots on a picture: "Found 2 of 4") · askEach (the spots asked one at a time) — explicit only                       */

function mechFits(type,m,s){
  if(type==='mcq'){
    var o=s.options||[];
    if(m==='doors')return o.length>=2&&o.length<=3;
    if(m==='chat')return o.length&&o.every(function(x){return /^\s*['"‘“]/.test(T(x.text));});
    if(m==='tiles')return o.length>=3&&o.length<=4&&o.every(function(x){return T(x.text).length<=70;});
  }
  if(type==='sort'&&m==='stamps')return (s.cards||[]).length<=10;
  if(type==='match'&&m==='memory')return (s.pairs||[]).length<=6;
  return true;
}
/* the mechanic for this screen: explicit x_mechanic, else the module's rotation over the mechanics that fit */
function mechanicFor(type,s){
  var list=MECH[type]||[],want=s.x_mechanic||s.mechanic;
  if(want&&list.indexOf(want)>=0&&mechFits(type,want,s))return want;

(function(){var _bfs=buildFromScript;buildFromScript=function(){
  (SCRIPT.screens||[]).forEach(function(s){if(MECH[s.type])mechanicFor(s.type,s);});
  _bfs();};})();

/* ---------------------------------------------------------------- HOTSPOT: ask each (E1, 2026-10-19) ------ */
/* One picture, the right targets asked one at a time ('Where is the vomitory?' = target.x_ask, else its name).
   A wrong tap shows the target's x_hint; a second wrong tap marks the place and asks the learner to tap it.
   A found target gets its name as a label on the picture and shows its `action` line. XP: s.xp.perTarget for each
   target right first time; mechDone at the end (firstTimeCorrect only for a run with no wrong tap).
   Buttons under the picture (the target names) are the keyboard / screen-reader alternative. */
/* E1 (2026-10-20) pages + choices:
   s.x_pages = [{media, alt, title, targets[], x_end, x_next}] — several pictures in turn (e.g. tickets), each with its own targets;
   after a page's last target its x_end line shows and 'Next' (x_next) opens the next page. Without x_pages: one page = s.media + s.targets.
   target.x_choices = [{text, best:true|false, feedback}] — once the place is found, the question x_choiceAsk (target, else screen)
   and the options; a wrong pick shows its feedback and stays open; the best ends the step (XP s.xp.perChoice if picked first time).
   A target with x_choices and no x (x_noSpot) is a choices-only step: nothing to tap on the picture.
   E1 (2026-10-21): a target may carry `media` (an image asset id): shown above its question (16:9, cover, at most 45vh; alt text
   from the asset; a missing file hides the picture). */
function hotspotAskEach(s,h){
  var keep=function(t){return t.correct!==false;};
  var pages=(s.x_pages&&s.x_pages.length)?s.x_pages.map(function(p){return {img:p.media?sc2_assetFile(p.media):media(s)[0],alt:T(p.alt)||T(s.heading)||'',title:T(p.title),tg:(p.targets||[]).filter(keep),end:T(p.x_end),nxt:T(p.x_next)};})
    :[{img:media(s)[0],alt:T(s.heading)||'',title:'',tg:(s.targets||[]).filter(keep),end:'',nxt:''}];
  var total=pages.reduce(function(n,p){return n+p.tg.length;},0);
  mechTag(h,'askEach');head(s,h);task(s,h);
  var pi=0,k=0,step=0,miss=0,cmiss=0,allFirst=true,done_=false,inChoice=false,btns=[],li=[];
  var ptitle=el('<p class="askpage"></p>'),ask=el('<div class="askq" role="status" aria-live="polite"></div>'),cnt=el('<div class="findcount"></div>'),
      wrap=el('<div class="scene-wrap m-findall m-askeach"></div>'),list=el('<div class="findlist"></div>'),
      chHost=el('<div class="askchoices"></div>'),fbHost=el('<div class="mfb" role="status"></div>'),pgBar=el('<div class="askpagebar"></div>');
  h.appendChild(cnt);h.appendChild(ptitle);h.appendChild(ask);h.appendChild(wrap);h.appendChild(list);h.appendChild(chHost);h.appendChild(fbHost);h.appendChild(pgBar);
  var spot=function(t){return t.x!==undefined&&!t.x_noSpot;};
  function page(){
    var P=pages[pi];k=0;miss=0;wrap.innerHTML='';list.innerHTML='';pgBar.innerHTML='';
    ptitle.textContent=P.title||'';ptitle.style.display=P.title?'':'none';
    wrap.appendChild(imgOrPh(P.img,P.alt));
    btns=P.tg.map(function(t,i){if(!spot(t))return null;
      var b=el('<button type="button" class="hz2" style="left:'+t.x+'%;top:'+t.y+'%;width:'+t.w+'%;height:'+t.h+'%" aria-label="'+T(t.name)+'"></button>');
      b.addEventListener('click',function(e){e.stopPropagation();tap(i);});wrap.appendChild(b);return b;});
    li=P.tg.map(function(t,i){if(!spot(t))return null;var b=el('<button type="button" class="chip2">'+T(t.name)+'</button>');
      b.addEventListener('click',function(){tap(i);});list.appendChild(b);return b;});
    show();
  }
  function show(){

    var o=i>=0?P.tg[i]:null;
    if(o&&i!==k&&spot(o)&&spot(t)&&o.x===t.x&&o.y===t.y&&o.w===t.w&&o.h===t.h)i=k;   /* two questions on the same place (e.g. one grid square): a tap there answers the one asked */
    if(i===k){
      var b=btns[k];if(b){b.classList.remove('hz-show');b.classList.add('g-ok');b.disabled=true;b.appendChild(el('<span class="hzlabel">'+T(t.name)+'</span>'));}
      if(miss===0)awardXp(s.id+':t'+step,s.xp&&s.xp.perTarget);else allFirst=false;

      return;
    }

    if(miss===1){var w=fb('bad',U('notQuite'),T(t.x_hint)||T(s.feedbackWrong)||U('pickAgain'));fbHost.appendChild(w);svin(w);}
    else if(btns[k]){btns[k].classList.add('hz-show');var w2=fb('bad',U('notQuite'),U('hereItIs'));fbHost.appendChild(w2);svin(w2);}

      var ci=cw.querySelector('img');if(ci)ci.addEventListener('error',function(){cw.remove();});chHost.appendChild(cw);}
    var q=T(t.x_choiceAsk)||T(s.x_choiceAsk);if(q)chHost.appendChild(el('<p class="askchq"><b>'+q+'</b></p>'));
    (t.x_choices||[]).forEach(function(c){
      var b=el('<button type="button" class="opt askopt">'+T(c.text)+'</button>');
      b.addEventListener('click',function(){if(b.disabled)return;fbHost.innerHTML='';
        if(c.best){chHost.querySelectorAll('button').forEach(function(x){x.disabled=true;});b.classList.add('g-ok');
          if(cmiss===0)awardXp(s.id+':c'+step,s.xp&&s.xp.perChoice);
          var g=fb('good',U('spotOn'),T(c.feedback)||'');fbHost.appendChild(g);svin(g);
          var a=el('<button type="button" class="btn primary askgo">'+U('next')+'</button>');a.addEventListener('click',function(){a.remove();advance();});
          pgBar.innerHTML='';pgBar.appendChild(a);}
        else{cmiss++;allFirst=false;b.disabled=true;b.classList.add('g-bad');

    mechDone(s,h,allFirst);var a=h.querySelector('.actions')||actions(h);a.appendChild(contBtn(T(s['continue'])||U('cont'),next));
  }
  page();
}

/* hazard hunt: Zoom · Reset · Describe image under the picture; "Found a of b" as numbered squares that fill in */

  var bz=ctl.children[0],br=ctl.children[1],bd=ctl.children[2];

    cnt.after(sq);upd=function(){var f=wrap.querySelectorAll('.hz2.g-ok').length;sq.querySelectorAll('i').forEach(function(x,i){x.classList.toggle('on',i<f);});};
    new MutationObserver(upd).observe(cnt,{childList:true,characterData:true,subtree:true});upd();
    desc.after(cnt);cnt.after(sq);}
  /* askEach pages (E1, 2026-10-20): the picture is replaced page by page - the description and the squares follow the page shown */
  if(wrap.classList.contains('m-askeach'))new MutationObserver(function(){

function clFillTranscript(box,sc){
